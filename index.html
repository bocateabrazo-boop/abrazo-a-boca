<!DOCTYPE html>
<html lang="es">
<head>

<title>Abrazo a Boca · Inscripción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Josefin+Sans:wght@600&family=Playfair+Display:ital,wght@0,900;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root {
    --azul: #0d1b4c; --azul-hondo: #08133a; --oro: #f5c518; --oro-suave: #e9c46a;
    --crema: #f6ecd6; --error-fondo: #fde2e2; --error: #9b1c1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--azul-hondo); color: var(--crema);
    font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 18px; line-height: 1.5;
  }
  .fondo {
    position: fixed; inset: 0; z-index: -1;
    background:
      linear-gradient(to bottom, rgba(8,19,58,.55) 0%, rgba(8,19,58,.15) 38%, rgba(8,19,58,.70) 68%, rgba(8,19,58,.96) 100%),
      url('fondo.jpg') center top / cover no-repeat;
  }
  main { max-width: 32rem; margin: 0 auto; padding: 1.75rem 1.1rem 3rem; }

  .cabecera { text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  .escudo { width: 64px; height: auto; display: block; margin: 0 auto .9rem; filter: drop-shadow(0 3px 8px rgba(0,0,0,.5)); }
  .volanta {
    display: flex; align-items: center; gap: .8rem; justify-content: center;
    font-family: 'Josefin Sans', sans-serif; font-weight: 600; letter-spacing: .28em;
    color: var(--oro-suave); font-size: .85rem; text-transform: uppercase;
  }
  .volanta::before, .volanta::after { content: ''; height: 2px; width: 2.2rem; background: var(--oro-suave); }
  h1 {
    font-family: 'Playfair Display', Georgia, serif; font-weight: 900; text-transform: uppercase;
    line-height: .95; margin: .6rem 0 .5rem; letter-spacing: -.01em;
  }
  h1 .a { display: block; color: var(--crema); font-size: clamp(2.6rem, 12vw, 3.6rem); }
  h1 .boca { display: block; color: var(--oro); font-size: clamp(4rem, 21vw, 6.2rem); }
  .lema { font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 600; font-size: 1.3rem; margin: 0; }
  .espacio { height: 30vh; }
  .convoca {
    font-family: 'Playfair Display', Georgia, serif; font-size: 1.25rem; text-align: center;
    margin: 0 0 .4rem; text-shadow: 0 2px 10px rgba(0,0,0,.7);
  }
  .cuando { text-align: center; color: var(--oro-suave); margin: 0 0 1.25rem; font-weight: 700; }
  .raya { width: 6rem; height: 2px; background: var(--oro-suave); margin: .9rem auto 1.4rem; }

  .tarjeta {
    background: rgba(8,19,58,.88); border: 2px solid var(--oro); border-radius: 16px;
    padding: 1.4rem 1.2rem 1.5rem; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .tarjeta h2 {
    font-family: 'Josefin Sans', sans-serif; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--oro); font-size: 1rem; text-align: center; margin: 0 0 .4rem;
  }
  label { display: block; font-weight: 700; margin: 1rem 0 .3rem; color: var(--crema); }
  input {
    width: 100%; font: inherit; padding: .75rem .85rem; border: 2px solid transparent;
    border-radius: 10px; background: #fffaf0; color: var(--azul-hondo);
  }
  input:focus { outline: 3px solid var(--oro); outline-offset: 1px; }
  .ayuda { font-size: .85rem; color: #d9d2c0; margin: .3rem 0 0; }
  button, .boton {
    display: block; width: 100%; margin-top: 1.5rem; padding: 1rem; font: inherit; font-weight: 700;
    font-size: 1.1rem; letter-spacing: .04em; color: var(--azul-hondo); background: var(--oro);
    border: 0; border-radius: 12px; cursor: pointer; text-align: center; text-decoration: none;
  }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, .boton:focus-visible { outline: 3px solid var(--crema); outline-offset: 3px; }
  .error { background: var(--error-fondo); color: var(--error); font-weight: 700; padding: .75rem; border-radius: 10px; margin-top: 1rem; }
  .entrada img { width: 100%; max-width: 340px; height: auto; display: block; margin: .75rem auto 0; border-radius: 12px; }
  .saludo { text-align: center; font-weight: 700; font-size: 1.15rem; margin: 0; }
  .aviso { background: rgba(245,197,24,.14); border-left: 4px solid var(--oro); border-radius: 8px; padding: .9rem 1rem; margin-top: 1.25rem; }
  .sello { text-align: center; color: #b9b2a2; font-size: .75rem; margin-top: 2.5rem; }

  /* ===== Panel del equipo ===== */
  .panel-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: 1rem; }
  .panel-top h1 { font-size: 1.6rem; margin: 0; }
  .panel-top .quien { font-size: .8rem; color: #d9d2c0; }
  .chico { width: auto; margin: 0; padding: .55rem .9rem; font-size: .9rem; }
  .secundario { background: transparent; color: var(--oro); border: 2px solid var(--oro); }
  .numeros { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: 1rem; }
  .numero-caja { background: rgba(8,19,58,.92); border: 2px solid var(--oro); border-radius: 14px; padding: .8rem; text-align: center; }
  .numero-caja b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 2.2rem; color: var(--oro); line-height: 1.1; }
  .numero-caja span { font-size: .85rem; }
  .acciones { display: flex; gap: .6rem; margin: .9rem 0; flex-wrap: wrap; }
  .acciones button { flex: 1; margin: 0; padding: .75rem; font-size: .95rem; }
  .ficha { background: #fffaf0; color: var(--azul-hondo); border-radius: 12px; padding: .8rem .9rem; margin-bottom: .6rem; font-size: .95rem; }
  .ficha .nom { font-weight: 700; font-size: 1.05rem; }
  .ficha .det { color: #3d4466; word-break: break-word; }
  .ficha .cod { font-family: monospace; letter-spacing: .1em; }
  .etiqueta { display: inline-block; background: var(--azul); color: var(--oro); border-radius: 6px; padding: 0 .45rem; font-size: .8rem; margin-left: .3rem; }
  select { width: 100%; font: inherit; padding: .75rem .85rem; border-radius: 10px; border: 0; background: #fffaf0; color: var(--azul-hondo); }
  .nota { font-size: .85rem; color: #d9d2c0; margin: .6rem 0 0; }
  .ok { background: #dff3e6; color: #1f5b3a; font-weight: 700; padding: .75rem; border-radius: 10px; margin-top: 1rem; }
  .con-ojo { position: relative; }
  .con-ojo input { padding-right: 5.5rem; }
  .ojo { position: absolute; right: .35rem; top: 50%; transform: translateY(-50%); width: auto; margin: 0;
    padding: .45rem .8rem; font-size: .9rem; background: var(--azul); color: var(--oro); border-radius: 8px; }

  /* ===== Puerta ===== */
  .pestanas { display: flex; gap: .5rem; margin-bottom: 1rem; }
  .pestanas button { margin: 0; flex: 1; padding: .7rem; font-size: 1rem; }
  .pestanas .apagada { background: transparent; color: var(--oro); border: 2px solid var(--oro); }
  .camara { position: relative; background: #000; border: 3px solid var(--oro); border-radius: 16px; overflow: hidden; aspect-ratio: 1 / 1; }
  .camara video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camara .mira { position: absolute; inset: 18%; border: 3px dashed rgba(245,197,24,.85); border-radius: 14px; pointer-events: none; }
  .camara .estado { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(8,19,58,.82); color: var(--crema); text-align: center; padding: .5rem; font-size: .95rem; }
  .resultado { border-radius: 16px; padding: 1.2rem 1rem; text-align: center; margin: 1rem 0; border: 3px solid; }
  .resultado .titulo { font-weight: 700; font-size: 1.15rem; margin: 0; }
  .resultado .persona { font-weight: 700; font-size: 1.5rem; margin: .4rem 0 0; line-height: 1.2; }
  .resultado .num { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 5.5rem; line-height: 1; margin: .3rem 0; }
  .resultado .chica { margin: .2rem 0 0; }
  .r-ok  { background: #dff3e6; color: #14532d; border-color: #1f7a4a; }
  .r-rep { background: #fdf0cf; color: #6b4a00; border-color: #b7860b; }
  .r-mal { background: #fde2e2; color: #7f1d1d; border-color: #b42318; }
  .resultado button { background: var(--azul); color: var(--oro); margin-top: 1rem; }
  .ficha .dar { width: auto; margin: .5rem 0 0; padding: .55rem .9rem; font-size: .95rem; }

  /* ===== Sorteo ===== */
  .sorteo { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2rem 1rem 1.25rem; text-align: center; }
  .sorteo .cab { text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .sorteo .cab h1 { margin: .4rem 0 0; line-height: .95; }
  .sorteo .cab .a { font-size: clamp(1.6rem, 4vw, 2.6rem); color: var(--crema); display: block; }
  .sorteo .cab .boca { font-size: clamp(2.6rem, 7vw, 4.6rem); color: var(--oro); display: block; }
  .sorteo .centro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .sorteo .rotulo { font-family: 'Josefin Sans', sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--oro-suave); font-size: clamp(1rem, 2.4vw, 1.6rem); }
  .sorteo .bola { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; line-height: 1; color: var(--oro);
    font-size: clamp(8rem, 30vw, 24rem); text-shadow: 0 6px 30px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
  .sorteo .bola.gira { color: var(--crema); opacity: .85; }
  .sorteo .ganadora { font-size: clamp(1.6rem, 4.5vw, 3.2rem); font-weight: 700; color: var(--crema); text-shadow: 0 2px 14px rgba(0,0,0,.8); margin: .3rem 0 0; }
  .sorteo .controles { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; align-items: center; }
  .sorteo .controles button { width: auto; margin: 0; padding: .8rem 1.4rem; }
  .sorteo .grande { font-size: 1.3rem; padding: 1rem 2.6rem !important; }
  .sorteo .historial { margin-top: .9rem; font-size: .95rem; color: #d9d2c0; }
  .sorteo .historial s { opacity: .7; }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ====== CONFIGURACIÓN ======
const VERSION = 'v2026-10-08.3';
const SUPABASE_URL = 'https://wteiwjngcgjorzhgqzju.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e-EmbLajXgx8EVcWoyVtfA_MsrPVxoL';
const FECHA = '';   // ej: 'Sábado 15 de noviembre · 17 h' (vacío = no se muestra)
const LUGAR = '';   // ej: 'Brandsen 805, La Boca'
const CUPO = 800;
// ===========================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const URL_BASE = window.location.origin + window.location.pathname;

function cargarImagen(src) {
  return new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
}

// Arma la entrada (imagen PNG) con la estética del flyer
async function armarEntrada(codigo, nombre) {
  await Promise.all([
    document.fonts.load('900 60px "Playfair Display"'),
    document.fonts.load('italic 600 30px "Playfair Display"'),
    document.fonts.load('600 22px "Josefin Sans"'),
    document.fonts.load('700 30px "Atkinson Hyperlegible"')
  ]).catch(() => {});
  const escudo = await cargarImagen('escudo.png');

  const tmp = document.createElement('div');
  new QRCode(tmp, { text: URL_BASE + '?id=' + codigo, width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M });
  await new Promise((r) => setTimeout(r, 60));
  const qr = tmp.querySelector('canvas');

  const W = 640, H = 1040;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1b4c'); g.addColorStop(1, '#08133a');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#f5c518'; x.lineWidth = 6; x.strokeRect(18, 18, W - 36, H - 36);

  x.textAlign = 'center';
  let y = 48;
  if (escudo) { const h = 90, w = h * escudo.width / escudo.height; x.drawImage(escudo, (W - w) / 2, y, w, h); y += 90 + 46; }
  else { y += 40; }

  x.fillStyle = '#e9c46a'; x.font = '600 22px "Josefin Sans", sans-serif';
  x.fillText('M U J E R E S   P O R   B O C A', W / 2, y);
  y += 66;
  x.font = '900 56px "Playfair Display", Georgia, serif';
  x.fillStyle = '#f6ecd6'; x.fillText('ABRAZO A', W / 2, y);
  y += 82;
  x.font = '900 86px "Playfair Display", Georgia, serif';
  x.fillStyle = '#f5c518'; x.fillText('BOCA', W / 2, y);
  y += 50;
  x.font = '700 30px "Atkinson Hyperlegible", sans-serif';
  x.fillStyle = '#f6ecd6'; x.fillText(nombre, W / 2, y, W - 100);

  y += 28;
  const caja = 460, qx = (W - caja) / 2;
  x.fillStyle = '#ffffff'; x.fillRect(qx, y, caja, caja);
  x.drawImage(qr, qx + 20, y + 20, caja - 40, caja - 40);
  y += caja + 62;

  x.fillStyle = '#f5c518'; x.font = '700 50px "Atkinson Hyperlegible", sans-serif';
  x.fillText(codigo.split('').join(' '), W / 2, y);
  y += 46;
  x.fillStyle = '#f6ecd6'; x.font = 'italic 600 26px "Playfair Display", Georgia, serif';
  x.fillText('Mostrala en la entrada', W / 2, Math.min(y, H - 40));

  return c.toDataURL('image/png');
}

function Cabecera() {
  return (
    <header className="cabecera">
      <img className="escudo" src="escudo.png" alt="" />
      <div className="volanta">Mujeres por Boca</div>
      <h1><span className="a">Abrazo a</span><span className="boca">Boca</span></h1>
      <p className="lema">Nos une Boca. Nos mueve el futuro.</p>
    </header>
  );
}

function Cuando() {
  if (!FECHA && !LUGAR) return null;
  return <p className="cuando">{FECHA}{FECHA && LUGAR ? ' · ' : ''}{LUGAR}</p>;
}

function Inscripcion() {
  const [f, setF] = useState({ nombre: '', apellido: '', dni: '', email: '', telefono: '' });
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState('');
  const [listo, setListo] = useState(null);

  const cambiar = (k) => (e) => setF({ ...f, [k]: e.target.value });

  async function enviar(e) {
    e.preventDefault();
    if (enviando) return;
    setError('');
    setEnviando(true);
    const { data, error: err } = await sb.rpc('registrar', {
      p_nombre: f.nombre.trim(),
      p_apellido: f.apellido.trim(),
      p_dni: f.dni.replace(/\D/g, ''),
      p_email: f.email.trim().toLowerCase(),
      p_telefono: f.telefono.trim()
    });
    if (err) {
      setError(err.message || 'No se pudo enviar. Probá de nuevo.');
      setEnviando(false);
      return;
    }
    const imagen = await armarEntrada(data.codigo, data.nombre);
    setListo({ ...data, imagen });
    setEnviando(false);
    window.scrollTo(0, 0);
  }

  if (listo) {
    return (
      <main>
        <Cabecera />
        <div className="raya" />
        <section className="tarjeta entrada">
          <p className="saludo">
            {listo.ya_inscripta
              ? listo.nombre + ', ya estabas inscripta. Esta es tu entrada:'
              : '¡Listo, ' + listo.nombre + '! Esta es tu entrada:'}
          </p>
          <img src={listo.imagen} alt={'Entrada con código QR ' + listo.codigo} />
          <a className="boton" href={listo.imagen} download={'entrada-abrazo-a-boca-' + listo.codigo + '.png'}>Guardar la entrada</a>
          <div className="aviso">
            <b>Guardala o sacale captura ahora.</b> Es tu entrada: la escaneamos al llegar
            y ahí te damos tu número para el sorteo. También te va a llegar por mail.
          </div>
        </section>
        <p className="sello">{VERSION}</p>
      </main>
    );
  }

  return (
    <main>
      <Cabecera />
      <div className="espacio" />
      <p className="convoca">Convocamos a socias e hinchas<br />a abrazar nuestra casa.</p>
      <div className="raya" />
      <Cuando />
      <section className="tarjeta">
        <h2>Inscripción</h2>
        <form onSubmit={enviar} noValidate>
          <label htmlFor="nombre">Nombre</label>
          <input id="nombre" value={f.nombre} onChange={cambiar('nombre')} autoComplete="given-name" />

          <label htmlFor="apellido">Apellido</label>
          <input id="apellido" value={f.apellido} onChange={cambiar('apellido')} autoComplete="family-name" />

          <label htmlFor="dni">DNI</label>
          <input id="dni" value={f.dni} onChange={cambiar('dni')} inputMode="numeric" />
          <p className="ayuda">Solo números. Sirve para buscarte en la entrada si no encontrás el QR.</p>

          <label htmlFor="email">Mail</label>
          <input id="email" type="email" value={f.email} onChange={cambiar('email')}
            autoComplete="email" autoCapitalize="none" autoCorrect="off" spellCheck="false" />

          <label htmlFor="telefono">Teléfono</label>
          <input id="telefono" type="tel" value={f.telefono} onChange={cambiar('telefono')} autoComplete="tel" />

          <button type="submit" disabled={enviando}>{enviando ? 'Inscribiendo…' : 'Quiero abrazar a Boca'}</button>
          {error && <p className="error" role="alert">{error}</p>}
        </form>
      </section>
      <p className="sello">{VERSION}</p>
    </main>
  );
}

// ================= PANEL DEL EQUIPO (?p=equipo) =================
const sinTildes = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const fechaAR = (d) => d ? new Date(d).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

function descargarCSV(lista) {
  const col = ['Fecha inscripción', 'Nombre', 'Apellido', 'DNI', 'Email', 'Teléfono', 'Código', 'Ingreso', 'N° sorteo'];
  const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const filas = lista.map((r) => [fechaAR(r.creado_at), r.nombre, r.apellido, r.dni, r.email, r.telefono, r.codigo, fechaAR(r.ingreso_at), r.numero_sorteo || ''].map(esc).join(';'));
  const csv = '\ufeff' + col.map(esc).join(';') + '\n' + filas.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'inscriptas-abrazo-a-boca-' + new Date().toLocaleDateString('es-AR').replace(/\//g, '-') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function Login() {
  const [email, setEmail] = useState('');
  const [clave, setClave] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState('');
  const [ver, setVer] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    if (enviando) return;
    setError('');
    setEnviando(true);
    const { error: err } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: clave });
    if (err) setError('Mail o contraseña incorrectos.');
    setEnviando(false);
  }

  return (
    <main>
      <Cabecera />
      <div className="raya" />
      <section className="tarjeta">
        <h2>Ingreso del equipo</h2>
        <form onSubmit={entrar} noValidate>
          <label htmlFor="lmail">Mail</label>
          <input id="lmail" type="email" value={email} onChange={(e) => setEmail(e.target.value)}
            autoComplete="username" autoCapitalize="none" autoCorrect="off" spellCheck="false" />
          <label htmlFor="lclave">Contraseña</label>
          <div className="con-ojo">
            <input id="lclave" type={ver ? 'text' : 'password'} value={clave} onChange={(e) => setClave(e.target.value)}
              autoComplete="current-password" autoCapitalize="none" autoCorrect="off" spellCheck="false" />
            <button type="button" className="ojo" onClick={() => setVer(!ver)} aria-pressed={ver}>{ver ? 'Ocultar' : 'Ver'}</button>
          </div>
          <button type="submit" disabled={enviando}>{enviando ? 'Entrando…' : 'Entrar'}</button>
          {error && <p className="error" role="alert">{error}</p>}
        </form>
      </section>
      <p className="sello">{VERSION}</p>
    </main>
  );
}

function claveAlAzar() {
  const pal = ['azul', 'oro', 'abrazo', 'bombonera', 'tribuna', 'barrio', 'boca', 'xeneize', 'garra', 'estrella'];
  const r = (n) => Math.floor(Math.random() * n);
  return pal[r(pal.length)] + '-' + pal[r(pal.length)] + '-' + (10 + r(90));
}

async function llamarEquipo(cuerpo) {
  const { data, error } = await sb.functions.invoke('equipo', { body: cuerpo });
  if (error) {
    const st = error.context && error.context.status;
    let msg = st === 404 ? 'No existe la función "equipo" en Supabase (código 404).'
      : st === 401 ? 'Supabase rechazó la sesión (código 401). Revisá "Verify JWT" en la función.'
      : st ? 'Error del servidor (código ' + st + ').'
      : 'No se pudo conectar con la función "equipo" (' + (error.message || 'sin respuesta') + ').';
    try { const j = await error.context.json(); if (j && (j.error || j.message || j.msg)) msg = (j.error || j.message || j.msg) + (st ? ' (código ' + st + ')' : ''); } catch (e) {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function mensajeWhatsApp(nombre, mail, clave) {
  return 'Hola' + (nombre ? ' ' + nombre : '') + '! Ya tenés acceso al panel de Abrazo a Boca.\n' +
    'Entrá acá: ' + window.location.origin + '/?p=equipo\n' +
    'Mail: ' + mail + '\nClave: ' + clave + '\n' +
    'No compartas la clave. Si la perdés, avisame y te la cambio.';
}

function Equipo({ miEmail }) {
  const [miembros, setMiembros] = useState([]);
  const [f, setF] = useState({ email: '', nombre: '', rol: 'organizadora', clave: claveAlAzar() });
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState('');
  const [aviso, setAviso] = useState(null);

  async function cargar() {
    const { data, error: err } = await sb.rpc('listar_equipo');
    if (err) setError(err.message); else setMiembros(data || []);
  }
  useEffect(() => { cargar(); }, []);

  async function guardar(e) {
    e.preventDefault();
    if (enviando) return;
    setError(''); setAviso(null);
    const mail = f.email.trim().toLowerCase();
    const clave = f.clave.trim();
    if (clave.length < 8) { setError('La clave tiene que tener al menos 8 caracteres.'); return; }
    setEnviando(true);
    try {
      await llamarEquipo({ accion: 'agregar', email: mail, nombre: f.nombre.trim(), rol: f.rol, clave });
      setAviso({ titulo: 'Listo: ' + mail + ' ya puede entrar.', texto: mensajeWhatsApp(f.nombre.trim(), mail, clave) });
      setF({ email: '', nombre: '', rol: 'organizadora', clave: claveAlAzar() });
      cargar();
    } catch (err) { setError(err.message); }
    setEnviando(false);
  }

  async function nuevaClave(m) {
    const clave = claveAlAzar();
    if (!window.confirm('¿Cambiar la clave de ' + m.email + '? La nueva va a ser: ' + clave)) return;
    setError(''); setAviso(null);
    try {
      await llamarEquipo({ accion: 'clave', email: m.email, clave });
      setAviso({ titulo: 'Clave nueva para ' + m.email, texto: mensajeWhatsApp(m.nombre, m.email, clave) });
      window.scrollTo(0, document.body.scrollHeight);
    } catch (err) { setError(err.message); }
  }

  async function quitar(mail) {
    if (!window.confirm('¿Quitar el acceso de ' + mail + '? Se borra su usuaria.')) return;
    setError(''); setAviso(null);
    try { await llamarEquipo({ accion: 'quitar', email: mail }); cargar(); }
    catch (err) { setError(err.message); }
  }

  async function copiar(t) {
    try { await navigator.clipboard.writeText(t); alert('Copiado. Pegalo en WhatsApp.'); }
    catch (e) { alert('No se pudo copiar. Seleccioná el texto y copialo a mano.'); }
  }

  const botonFicha = { marginTop: '.5rem', marginRight: '.5rem', display: 'inline-block', color: 'var(--azul)', borderColor: 'var(--azul)' };

  return (
    <section className="tarjeta" style={{ marginTop: '1.5rem' }}>
      <h2>Equipo</h2>
      {miembros.map((m) => (
        <div className="ficha" key={m.email}>
          <div className="nom">{m.nombre || m.email}<span className="etiqueta">{m.rol}</span></div>
          <div className="det">{m.email}</div>
          {m.email !== miEmail && (
            <div>
              <button className="chico secundario" style={botonFicha} onClick={() => nuevaClave(m)}>Cambiar clave</button>
              <button className="chico secundario" style={botonFicha} onClick={() => quitar(m.email)}>Quitar acceso</button>
            </div>
          )}
        </div>
      ))}

      <h2 style={{ marginTop: '1.5rem' }}>Sumar compañera</h2>
      <form onSubmit={guardar} noValidate>
        <label htmlFor="email-m">Mail</label>
        <input id="email-m" type="email" value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} autoCapitalize="none" autoCorrect="off" spellCheck="false" />
        <label htmlFor="nombre-m">Nombre</label>
        <input id="nombre-m" value={f.nombre} onChange={(e) => setF({ ...f, nombre: e.target.value })} />
        <label htmlFor="rol-m">Qué puede hacer</label>
        <select id="rol-m" value={f.rol} onChange={(e) => setF({ ...f, rol: e.target.value })}>
          <option value="organizadora">Organizadora: ve y descarga las inscripciones</option>
          <option value="acreditadora">Acreditadora: solo acredita en la puerta</option>
          <option value="admin">Administradora: todo, incluido el equipo</option>
        </select>
        <label htmlFor="clave-m">Clave</label>
        <input id="clave-m" value={f.clave} onChange={(e) => setF({ ...f, clave: e.target.value })} autoCapitalize="none" autoCorrect="off" spellCheck="false" />
        <p className="ayuda">Viene una sugerida. Podés cambiarla; mínimo 8 caracteres.</p>
        <button type="submit" disabled={enviando}>{enviando ? 'Creando…' : 'Crear acceso'}</button>
        {error && <p className="error" role="alert">{error}</p>}
      </form>

      {aviso && (
        <div className="ok" style={{ fontWeight: 400 }}>
          <b>{aviso.titulo}</b>
          <pre style={{ whiteSpace: 'pre-wrap', fontFamily: 'inherit', margin: '.6rem 0' }}>{aviso.texto}</pre>
          <button className="chico" style={{ marginTop: 0 }} onClick={() => copiar(aviso.texto)}>Copiar mensaje</button>
        </div>
      )}
    </section>
  );
}

// ================= PUERTA (acreditación) =================
function extraerCodigo(t) {
  let s = String(t || '').trim();
  try { const u = new URL(s); const id = u.searchParams.get('id'); if (id) s = id; } catch (e) {}
  return s.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
}

function horaAR(d) {
  return d ? new Date(d).toLocaleTimeString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit' }) : '';
}

function Escaner({ activo, onCodigo }) {
  const videoRef = React.useRef(null);
  const activoRef = React.useRef(activo);
  const cbRef = React.useRef(onCodigo);
  activoRef.current = activo;
  cbRef.current = onCodigo;
  const [error, setError] = useState('');
  const [lista, setLista] = useState(false);

  useEffect(() => {
    let stream = null, parar = false, timer = null, detector = null;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    (async () => {
      try {
        if ('BarcodeDetector' in window) {
          const f = await window.BarcodeDetector.getSupportedFormats();
          if (f.includes('qr_code')) detector = new window.BarcodeDetector({ formats: ['qr_code'] });
        }
      } catch (e) {}
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      } catch (e) {
        setError('No se pudo abrir la cámara. Dale permiso al navegador para usarla, o buscala por DNI más abajo.');
        return;
      }
      if (parar) { stream.getTracks().forEach((t) => t.stop()); return; }
      const v = videoRef.current;
      v.srcObject = stream;
      await v.play().catch(() => {});
      setLista(true);
      const mirar = async () => {
        if (parar) return;
        if (activoRef.current && v.readyState >= 2 && v.videoWidth) {
          let texto = null;
          try {
            if (detector) {
              const r = await detector.detect(v);
              if (r && r.length) texto = r[0].rawValue;
            } else if (window.jsQR) {
              const w = v.videoWidth, h = v.videoHeight;
              const k = Math.min(1, 720 / Math.max(w, h));
              canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
              ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
              const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
              const r = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
              if (r) texto = r.data;
            }
          } catch (e) {}
          if (texto && activoRef.current) { activoRef.current = false; cbRef.current(texto); }
        }
        timer = setTimeout(mirar, 180);
      };
      mirar();
    })();
    return () => { parar = true; clearTimeout(timer); if (stream) stream.getTracks().forEach((t) => t.stop()); };
  }, []);

  if (error) return <p className="error" role="alert">{error}</p>;
  return (
    <div className="camara">
      <video ref={videoRef} playsInline muted autoPlay />
      <div className="mira" aria-hidden="true" />
      <div className="estado">{!lista ? 'Abriendo cámara…' : activo ? 'Apuntá al QR' : 'En pausa'}</div>
    </div>
  );
}

function Resultado({ res, onSiguiente }) {
  let clase = 'r-mal', cuerpo = null;
  if (res.estado === 'ok') {
    clase = 'r-ok';
    cuerpo = (<>
      <p className="titulo">Bienvenida</p>
      <p className="persona">{res.nombre} {res.apellido}</p>
      <p className="chica">Número para el sorteo</p>
      <p className="num">{res.numero}</p>
    </>);
  } else if (res.estado === 'repetida') {
    clase = 'r-rep';
    cuerpo = (<>
      <p className="titulo">Ya había ingresado a las {horaAR(res.ingreso_at)}</p>
      <p className="persona">{res.nombre} {res.apellido}</p>
      <p className="chica">Es el mismo número</p>
      <p className="num">{res.numero}</p>
    </>);
  } else if (res.estado === 'no_encontrada') {
    cuerpo = (<>
      <p className="titulo">Código no encontrado</p>
      <p className="chica">{res.codigo ? 'Leído: ' + res.codigo + '. ' : ''}Buscala por DNI o apellido acá abajo.</p>
    </>);
  } else {
    cuerpo = (<>
      <p className="titulo">No se pudo acreditar</p>
      <p className="chica">{res.mensaje || 'Revisá la conexión y probá de nuevo.'}</p>
    </>);
  }
  return (
    <div className={'resultado ' + clase} role="status" aria-live="assertive">
      {cuerpo}
      <button onClick={onSiguiente}>Escanear la siguiente</button>
    </div>
  );
}

function Puerta({ codigoInicial }) {
  const [res, setRes] = useState(null);
  const [procesando, setProcesando] = useState(false);
  const [presentes, setPresentes] = useState(null);
  const [camara, setCamara] = useState(false);
  const [busca, setBusca] = useState('');
  const [lista, setLista] = useState(null);
  const [buscando, setBuscando] = useState(false);

  async function contar() {
    const { data } = await sb.rpc('contar_presentes');
    if (typeof data === 'number') setPresentes(data);
  }

  async function acreditar(texto) {
    const codigo = extraerCodigo(texto);
    if (!codigo || procesando) return;
    setProcesando(true);
    const { data, error } = await sb.rpc('acreditar', { p_codigo: codigo });
    setProcesando(false);
    if (error) { setRes({ estado: 'falla', mensaje: error.message }); return; }
    setRes(data);
    if (data && data.presentes != null) setPresentes(data.presentes);
    try { if (navigator.vibrate) navigator.vibrate(data.estado === 'ok' ? 150 : [90, 70, 90]); } catch (e) {}
    setLista(null); setBusca('');
    window.scrollTo(0, 0);
  }

  async function buscar(e) {
    if (e) e.preventDefault();
    const q = busca.trim();
    if (q.length < 3) { setLista([]); return; }
    setBuscando(true);
    const { data, error } = await sb.rpc('buscar_inscripta', { p_texto: q });
    setBuscando(false);
    if (error) { setRes({ estado: 'falla', mensaje: error.message }); return; }
    setLista(data || []);
  }

  useEffect(() => {
    contar();
    if (codigoInicial) {
      acreditar(codigoInicial);
      try { window.history.replaceState(null, '', window.location.pathname + '?p=puerta'); } catch (e) {}
    }
    const t = setInterval(contar, 30000);
    return () => clearInterval(t);
  }, []);

  return (
    <>
      <div className="numeros" style={{ gridTemplateColumns: '1fr' }}>
        <div className="numero-caja"><b>{presentes == null ? '…' : presentes}</b><span>ingresaron</span></div>
      </div>

      {procesando && <div className="resultado r-rep"><p className="titulo">Acreditando…</p></div>}
      {res && !procesando && <Resultado res={res} onSiguiente={() => setRes(null)} />}

      <section className="tarjeta">
        <h2>Escanear QR</h2>
        {camara
          ? <Escaner activo={!res && !procesando} onCodigo={acreditar} />
          : <button style={{ marginTop: '.5rem' }} onClick={() => setCamara(true)}>Abrir cámara</button>}
        {camara && <button className="secundario" onClick={() => setCamara(false)}>Cerrar cámara</button>}
      </section>

      <section className="tarjeta" style={{ marginTop: '1.25rem' }}>
        <h2>Sin QR</h2>
        <form onSubmit={buscar} noValidate>
          <label htmlFor="bus-p">DNI, apellido o código</label>
          <div className="buscador" style={{ display: 'flex', gap: '.5rem' }}>
            <input id="bus-p" value={busca} onChange={(e) => setBusca(e.target.value)} autoComplete="off" autoCorrect="off" spellCheck="false" />
            <button type="submit" className="chico" disabled={buscando} style={{ marginTop: 0 }}>{buscando ? '…' : 'Buscar'}</button>
          </div>
        </form>
        <div style={{ marginTop: '.9rem' }}>
          {lista && !lista.length && <p>No aparece. Revisá cómo se escribe, o probá con el DNI.</p>}
          {lista && lista.map((r) => (
            <div className="ficha" key={r.codigo}>
              <div className="nom">{r.nombre} {r.apellido}</div>
              <div className="det">DNI {r.dni}</div>
              {r.numero_sorteo
                ? <span className="etiqueta" style={{ marginLeft: 0 }}>Ya entró · N° {r.numero_sorteo}</span>
                : <button className="dar" onClick={() => acreditar(r.codigo)}>Dar ingreso</button>}
            </div>
          ))}
        </div>
      </section>
      <p className="sello">{VERSION}</p>
    </>
  );
}

function EntradaPublica({ codigo, onEquipo }) {
  return (
    <main>
      <Cabecera />
      <div className="raya" />
      <section className="tarjeta" style={{ textAlign: 'center' }}>

}

// ================= SORTEO (solo administradora, para proyectar) =================
function Sorteo() {
  const [rol, setRol] = useState(undefined);
  const [resumen, setResumen] = useState(null);
  const [historial, setHistorial] = useState([]);
  const [mostrado, setMostrado] = useState(null);
  const [ganadora, setGanadora] = useState(null);
  const [girando, setGirando] = useState(false);
  const [error, setError] = useState('');
  const [controles, setControles] = useState(true);
  const girandoRef = React.useRef(false);

  async function cargar() {
    const [r1, r2] = await Promise.all([sb.rpc('resumen_sorteo'), sb.rpc('listar_sorteo')]);
    if (!r1.error) setResumen(r1.data);
    if (!r2.error) setHistorial(r2.data || []);
  }

  useEffect(() => {
    (async () => {
      const { data, error } = await sb.rpc('mi_rol');
      const r = error ? null : data;
      setRol(r);
      if (r === 'admin') cargar();
    })();
  }, []);

  async function sortear() {
    if (girandoRef.current) return;
    girandoRef.current = true;
    setGirando(true); setGanadora(null); setError('');
    const tope = Math.max(1, (resumen && resumen.max_numero) || 100);
    const quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const giro = quieto ? null : setInterval(() => setMostrado(1 + Math.floor(Math.random() * tope)), 70);
    const espera = new Promise((ok) => setTimeout(ok, quieto ? 400 : 3200));
    const [{ data, error }] = await Promise.all([sb.rpc('sortear'), espera]);
    if (giro) clearInterval(giro);
    if (error) { setMostrado(null); setError(error.message); }
    else { setMostrado(data.numero); setGanadora(data); }
    girandoRef.current = false;
    setGirando(false);
    cargar();
  }

  async function ausente() {
    if (!ganadora || girandoRef.current) return;
    if (!window.confirm('¿El número ' + ganadora.numero + ' no está? Queda anotado como ausente y se sortea otra.')) return;
    await sb.rpc('marcar_ausente', { p_numero: ganadora.numero });
    sortear();
  }

  function pantallaCompleta() {
    const el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen();
  }

  useEffect(() => {
    const tecla = (e) => {
      if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if (rol === 'admin') sortear(); }
      if (e.key === 'h' || e.key === 'H') setControles((c) => !c);
      if (e.key === 'f' || e.key === 'F') pantallaCompleta();
    };
    window.addEventListener('keydown', tecla);
    return () => window.removeEventListener('keydown', tecla);
  }, [rol, resumen]);

  if (rol === undefined) return <main><p>Cargando…</p></main>;
  if (rol !== 'admin') return (
    <main><Cabecera /><div className="raya" />
      <section className="tarjeta"><p style={{ margin: 0 }}>El sorteo solo lo puede hacer la administradora.</p></section>
    </main>
  );

  const inicialApellido = (a) => (a ? ' ' + String(a).trim().charAt(0).toUpperCase() + '.' : '');
  const ganadas = historial.filter((h) => h.sorteo_estado === 'ganadora');
  const ausentes = historial.filter((h) => h.sorteo_estado === 'ausente');

  return (
    <div className="sorteo">
      <header className="cab">
        <div className="volanta">Mujeres por Boca</div>
        <h1><span className="a">Abrazo a</span><span className="boca">Boca</span></h1>
      </header>

      <div className="centro" aria-live="assertive">
        <div className="rotulo">{girando ? 'Sorteando' : ganadora ? 'Número ganador' : 'Sorteo'}</div>
        <div className={'bola' + (girando ? ' gira' : '')}>{mostrado == null ? '?' : mostrado}</div>
        {ganadora && !girando && <p className="ganadora">{ganadora.nombre}{inicialApellido(ganadora.apellido)}</p>}
        {error && <p className="error" role="alert" style={{ maxWidth: '32rem' }}>{error}</p>}
      </div>

      {controles && (
        <footer>
          <div className="controles">
            <button className="grande" onClick={sortear} disabled={girando || (resumen && resumen.disponibles === 0)}>
              {girando ? 'Sorteando…' : ganadora ? 'Sortear otro premio' : 'Sortear'}
            </button>
            {ganadora && !girando && <button className="secundario" onClick={ausente}>No está: sortear otra</button>}
            <button className="secundario" onClick={pantallaCompleta}>Pantalla completa</button>
            <button className="secundario" onClick={() => setControles(false)}>Ocultar botones</button>
          </div>
          {resumen && <div className="historial">Participan {resumen.disponibles} de {resumen.presentes} presentes</div>}
          {(ganadas.length > 0 || ausentes.length > 0) && (
            <div className="historial">
              Ganadoras: {ganadas.map((h) => 'N° ' + h.numero_sorteo).join(', ') || 'ninguna todavía'}
              {ausentes.length > 0 && <> · Ausentes: {ausentes.map((h, i) => <s key={i}>{'N° ' + h.numero_sorteo}</s>).reduce((a, b) => [a, ', ', b])}</>}
            </div>
          )}
          <div className="historial" style={{ fontSize: '.8rem' }}>Teclado: espacio sortea · F pantalla completa · H muestra u oculta los botones</div>
        </footer>
      )}
      {!controles && <button aria-label="Mostrar botones" onClick={() => setControles(true)} style={{ position: 'fixed', right: 8, bottom: 8, width: 28, height: 28, padding: 0, margin: 0, opacity: .15, borderRadius: 8 }} />}
    </div>
  );
}

function Tablero({ email, inicial, codigoInicial }) {
  const [rol, setRol] = useState(undefined);
  const [vista, setVista] = useState(inicial || 'inscripciones');
  const [lista, setLista] = useState(null);
  const [busca, setBusca] = useState('');
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState('');

  async function cargar() {
    setCargando(true); setError('');
    const { data, error: err } = await sb.rpc('listar_inscriptas');
    if (err) setError(err.message); else setLista(data || []);
    setCargando(false);
  }

  useEffect(() => {
    (async () => {
      const { data, error: err } = await sb.rpc('mi_rol');
      const r = err ? null : data;
      setRol(r);
      if (r === 'admin' || r === 'organizadora') cargar();
    })();
  }, []);

  const salir = () => sb.auth.signOut();

  const arriba = (
    <div className="panel-top">
      <div>
        <h1 style={{ color: 'var(--oro)' }}>Panel del equipo</h1>
        <div className="quien">{email}{rol ? ' · ' + rol : ''}</div>
      </div>
      <button className="chico secundario" onClick={salir}>Salir</button>
    </div>
  );

  if (rol === undefined) return <main>{arriba}<p>Cargando…</p></main>;

  if (!rol) return (
    <main>{arriba}
      <section className="tarjeta"><p style={{ margin: 0 }}>Este mail no está habilitado en el equipo. Pedile acceso a la administradora.</p></section>
      <p className="sello">{VERSION}</p>
    </main>
  );

  if (rol === 'acreditadora') return (
    <main>{arriba}<Puerta codigoInicial={codigoInicial} /></main>
  );

  const pestanas = (
    <div className="pestanas">
      <button className={vista === 'inscripciones' ? '' : 'apagada'} onClick={() => setVista('inscripciones')}>Inscripciones</button>
      <button className={vista === 'puerta' ? '' : 'apagada'} onClick={() => setVista('puerta')}>Puerta</button>
      {rol === 'admin' && <button className={vista === 'sorteo' ? '' : 'apagada'} onClick={() => setVista('sorteo')}>Sorteo</button>}
    </div>
  );

  if (vista === 'sorteo' && rol === 'admin') return (
    <main>{arriba}{pestanas}
      <section className="tarjeta">
        <h2>Sorteo</h2>
        <p style={{ marginTop: 0 }}>Abrí la pantalla del sorteo en la compu conectada al proyector o la pantalla grande, con tu sesión de administradora.</p>
        <a className="boton" href="?p=sorteo" target="_blank" rel="noopener">Abrir pantalla del sorteo</a>
        <p className="nota">Participan solo las que ingresaron por la puerta. Cada número sale una sola vez.</p>
      </section>
      <p className="sello">{VERSION}</p>
    </main>
  );

  if (vista === 'puerta') return (
    <main>{arriba}{pestanas}<Puerta codigoInicial={codigoInicial} /></main>
  );

  const total = lista ? lista.length : 0;
  const ingresaron = lista ? lista.filter((r) => r.numero_sorteo).length : 0;
  const q = sinTildes(busca.trim());
  const filtrada = !lista ? [] : !q ? lista : lista.filter((r) =>
    sinTildes(r.nombre + ' ' + r.apellido + ' ' + r.dni + ' ' + r.email + ' ' + r.telefono + ' ' + r.codigo).indexOf(q) >= 0);
  const visibles = filtrada.slice(0, 200);

  return (
    <main>
      {arriba}
      {pestanas}
      <div className="numeros">
        <div className="numero-caja"><b>{total}</b><span>inscriptas de {CUPO}</span></div>
        <div className="numero-caja"><b>{ingresaron}</b><span>ingresaron</span></div>
      </div>

      <section className="tarjeta">
        <h2>Inscripciones</h2>
        <div className="acciones">
          <button className="secundario" onClick={cargar} disabled={cargando}>{cargando ? 'Actualizando…' : 'Actualizar'}</button>
          <button onClick={() => lista && descargarCSV(lista)} disabled={!lista || !lista.length}>Descargar Excel</button>
        </div>
        <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por nombre, DNI, mail…" aria-label="Buscar" />
        {error && <p className="error" role="alert">{error}</p>}
        <div style={{ marginTop: '1rem' }}>
          {lista && !filtrada.length && <p>No hay resultados.</p>}
          {visibles.map((r) => (
            <div className="ficha" key={r.id}>
              <div className="nom">{r.nombre} {r.apellido}{r.numero_sorteo ? <span className="etiqueta">N° {r.numero_sorteo}</span> : null}</div>
              <div className="det">DNI {r.dni} · {r.email}{r.telefono ? ' · ' + r.telefono : ''}</div>
              <div className="det">Inscripta {fechaAR(r.creado_at)} · <span className="cod">{r.codigo}</span></div>
            </div>
          ))}
          {filtrada.length > 200 && <p className="nota">Se muestran 200 de {filtrada.length}. Usá el buscador o descargá el Excel.</p>}
        </div>
      </section>

      {rol === 'admin' && <Equipo miEmail={email} />}
      <p className="sello">{VERSION}</p>
    </main>
  );
}

function Panel({ inicial, codigoInicial, modo }) {
  const [sesion, setSesion] = useState(undefined);
  const [quiereLogin, setQuiereLogin] = useState(false);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSesion(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSesion(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (sesion === undefined) return <main><p>Cargando…</p></main>;
  if (!sesion) {
    if (codigoInicial && !quiereLogin) return <EntradaPublica codigo={codigoInicial} onEquipo={() => setQuiereLogin(true)} />;
    return <Login />;
  }
  if (modo === 'sorteo') return <Sorteo />;
  return <Tablero email={String(sesion.user.email || '').toLowerCase()} inicial={inicial} codigoInicial={codigoInicial} />;
}

function App() {
  const q = new URLSearchParams(window.location.search);
  const p = q.get('p');
  const id = q.get('id');
  if (id) return <Panel inicial="puerta" codigoInicial={id} />;
  if (p === 'equipo') return <Panel />;
  if (p === 'puerta') return <Panel inicial="puerta" />;
  if (p === 'sorteo') return <Panel modo="sorteo" />;
  return <Inscripcion />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
