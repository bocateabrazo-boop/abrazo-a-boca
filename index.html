<script type="text/babel">
const { useState, useEffect } = React;

// ====== CONFIGURACIÓN ======
const VERSION = 'v2026-10-08.2';
const SUPABASE_URL = 'https://wteiwjngcgjorzhgqzju.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e-EmbLajXgx8EVcWoyVtfA_MsrPVxoL';
const FECHA = '';   // ej: 'Sábado 15 de noviembre · 17 h' (vacío = no se muestra)
const LUGAR = '';   // ej: 'Brandsen 805, La Boca'
const CUPO = 800;
// ===========================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const URL_BASE = window.location.origin + window.location.pathname;

function cargarImagen(src) {
  return new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
}

// Arma la entrada (imagen PNG) con la estética del flyer
async function armarEntrada(codigo, nombre) {
  await Promise.all([
    document.fonts.load('900 60px "Playfair Display"'),
    document.fonts.load('italic 600 30px "Playfair Display"'),
    document.fonts.load('600 22px "Josefin Sans"'),
    document.fonts.load('700 30px "Atkinson Hyperlegible"')
  ]).catch(() => {});
  const escudo = await cargarImagen('escudo.png');

  const tmp = document.createElement('div');
  new QRCode(tmp, { text: URL_BASE + '?id=' + codigo, width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M });
  await new Promise((r) => setTimeout(r, 60));
  const qr = tmp.querySelector('canvas');

  const W = 640, H = 1040;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1b4c'); g.addColorStop(1, '#08133a');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#f5c518'; x.lineWidth = 6; x.strokeRect(18, 18, W - 36, H - 36);

  x.textAlign = 'center';
  let y = 48;
  if (escudo) { const h = 90, w = h * escudo.width / escudo.height; x.drawImage(escudo, (W - w) / 2, y, w, h); y += 90 + 46; }
  else { y += 40; }

  x.fillStyle = '#e9c46a'; x.font = '600 22px "Josefin Sans", sans-serif';
  x.fillText('M U J E R E S   P O R   B O C A', W / 2, y);
  y += 66;
  x.font = '900 56px "Playfair Display", Georgia, serif';
  x.fillStyle = '#f6ecd6'; x.fillText('ABRAZO A', W / 2, y);
  y += 82;
  x.font = '900 86px "Playfair Display", Georgia, serif';
  x.fillStyle = '#f5c518'; x.fillText('BOCA', W / 2, y);
  y += 50;
  x.font = '700 30px "Atkinson Hyperlegible", sans-serif';
  x.fillStyle = '#f6ecd6'; x.fillText(nombre, W / 2, y, W - 100);

  y += 28;
  const caja = 460, qx = (W - caja) / 2;
  x.fillStyle = '#ffffff'; x.fillRect(qx, y, caja, caja);
  x.drawImage(qr, qx + 20, y + 20, caja - 40, caja - 40);
  y += caja + 62;

  x.fillStyle = '#f5c518'; x.font = '700 50px "Atkinson Hyperlegible", sans-serif';
  x.fillText(codigo.split('').join(' '), W / 2, y);
  y += 46;
  x.fillStyle = '#f6ecd6'; x.font = 'italic 600 26px "Playfair Display", Georgia, serif';
  x.fillText('Mostrala en la entrada', W / 2, Math.min(y, H - 40));

  return c.toDataURL('image/png');
}

function Cabecera() {
  return (
    <header className="cabecera">
      <img className="escudo" src="escudo.png" alt="" />
      <div className="volanta">Mujeres por Boca</div>
      <h1><span className="a">Abrazo a</span><span className="boca">Boca</span></h1>
      <p className="lema">Nos une Boca. Nos mueve el futuro.</p>
    </header>
  );
}

function Cuando() {
  if (!FECHA && !LUGAR) return null;
  return <p className="cuando">{FECHA}{FECHA && LUGAR ? ' · ' : ''}{LUGAR}</p>;
}

function Inscripcion() {
  const [f, setF] = useState({ nombre: '', apellido: '', dni: '', email: '', telefono: '' });
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState('');
  const [listo, setListo] = useState(null);

  const cambiar = (k) => (e) => setF({ ...f, [k]: e.target.value });

  async function enviar(e) {
    e.preventDefault();
    if (enviando) return;
    setError('');
    setEnviando(true);
    const { data, error: err } = await sb.rpc('registrar', {
      p_nombre: f.nombre.trim(),
      p_apellido: f.apellido.trim(),
      p_dni: f.dni.replace(/\D/g, ''),
      p_email: f.email.trim().toLowerCase(),
      p_telefono: f.telefono.trim()
    });
    if (err) {
      setError(err.message || 'No se pudo enviar. Probá de nuevo.');
      setEnviando(false);
      return;
    }
    const imagen = await armarEntrada(data.codigo, data.nombre);
    setListo({ ...data, imagen });
    setEnviando(false);
    window.scrollTo(0, 0);
  }

  if (listo) {
    return (
      <main>
        <Cabecera />
        <div className="raya" />
        <section className="tarjeta entrada">
          <p className="saludo">
            {listo.ya_inscripta
              ? listo.nombre + ', ya estabas inscripta. Esta es tu entrada:'
              : '¡Listo, ' + listo.nombre + '! Esta es tu entrada:'}
          </p>
          <img src={listo.imagen} alt={'Entrada con código QR ' + listo.codigo} />
          <a className="boton" href={listo.imagen} download={'entrada-abrazo-a-boca-' + listo.codigo + '.png'}>Guardar la entrada</a>
          <div className="aviso">
            <b>Guardala o sacale captura ahora.</b> Es tu entrada: la escaneamos al llegar
            y ahí te damos tu número para el sorteo. También te va a llegar por mail.
          </div>
        </section>
        <p className="sello">{VERSION}</p>
      </main>
    );
  }

  return (
    <main>
      <Cabecera />
      <div className="espacio" />
      <p className="convoca">Convocamos a socias e hinchas<br />a abrazar nuestra casa.</p>
      <div className="raya" />
      <Cuando />
      <section className="tarjeta">
        <h2>Inscripción</h2>
        <form onSubmit={enviar} noValidate>
          <label htmlFor="nombre">Nombre</label>
          <input id="nombre" value={f.nombre} onChange={cambiar('nombre')} autoComplete="given-name" />

          <label htmlFor="apellido">Apellido</label>
          <input id="apellido" value={f.apellido} onChange={cambiar('apellido')} autoComplete="family-name" />

          <label htmlFor="dni">DNI</label>
          <input id="dni" value={f.dni} onChange={cambiar('dni')} inputMode="numeric" />
          <p className="ayuda">Solo números. Sirve para buscarte en la entrada si no encontrás el QR.</p>

          <label htmlFor="email">Mail</label>
          <input id="email" type="email" value={f.email} onChange={cambiar('email')}
            autoComplete="email" autoCapitalize="none" autoCorrect="off" spellCheck="false" />

          <label htmlFor="telefono">Teléfono</label>
          <input id="telefono" type="tel" value={f.telefono} onChange={cambiar('telefono')} autoComplete="tel" />

          <button type="submit" disabled={enviando}>{enviando ? 'Inscribiendo…' : 'Quiero abrazar a Boca'}</button>
          {error && <p className="error" role="alert">{error}</p>}
        </form>
      </section>
      <p className="sello">{VERSION}</p>
    </main>
  );
}

// ================= PANEL DEL EQUIPO (?p=equipo) =================
const sinTildes = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const fechaAR = (d) => d ? new Date(d).toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

function descargarCSV(lista) {
  const col = ['Fecha inscripción', 'Nombre', 'Apellido', 'DNI', 'Email', 'Teléfono', 'Código', 'Ingreso', 'N° sorteo'];
  const esc = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const filas = lista.map((r) => [fechaAR(r.creado_at), r.nombre, r.apellido, r.dni, r.email, r.telefono, r.codigo, fechaAR(r.ingreso_at), r.numero_sorteo || ''].map(esc).join(';'));
  const csv = '\ufeff' + col.map(esc).join(';') + '\n' + filas.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'inscriptas-abrazo-a-boca-' + new Date().toLocaleDateString('es-AR').replace(/\//g, '-') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function Login() {
  const [email, setEmail] = useState('');
  const [clave, setClave] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState('');
  const [ver, setVer] = useState(false);

  async function entrar(e) {
    e.preventDefault();
    if (enviando) return;
    setError('');
    setEnviando(true);
    const { error: err } = await sb.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: clave });
    if (err) setError('Mail o contraseña incorrectos.');
    setEnviando(false);
  }

  return (
    <main>
      <Cabecera />
      <div className="raya" />
      <section className="tarjeta">
        <h2>Ingreso del equipo</h2>
        <form onSubmit={entrar} noValidate>
          <label htmlFor="lmail">Mail</label>
          <input id="lmail" type="email" value={email} onChange={(e) => setEmail(e.target.value)}
            autoComplete="username" autoCapitalize="none" autoCorrect="off" spellCheck="false" />
          <label htmlFor="lclave">Contraseña</label>
          <div className="con-ojo">
            <input id="lclave" type={ver ? 'text' : 'password'} value={clave} onChange={(e) => setClave(e.target.value)}
              autoComplete="current-password" autoCapitalize="none" autoCorrect="off" spellCheck="false" />
            <button type="button" className="ojo" onClick={() => setVer(!ver)} aria-pressed={ver}>{ver ? 'Ocultar' : 'Ver'}</button>
          </div>
          <button type="submit" disabled={enviando}>{enviando ? 'Entrando…' : 'Entrar'}</button>
          {error && <p className="error" role="alert">{error}</p>}
        </form>
      </section>
      <p className="sello">{VERSION}</p>
    </main>
  );
}

function claveAlAzar() {
  const pal = ['azul', 'oro', 'abrazo', 'bombonera', 'tribuna', 'barrio', 'boca', 'xeneize', 'garra', 'estrella'];
  const r = (n) => Math.floor(Math.random() * n);
  return pal[r(pal.length)] + '-' + pal[r(pal.length)] + '-' + (10 + r(90));
}

async function llamarEquipo(cuerpo) {
  const { data, error } = await sb.functions.invoke('equipo', { body: cuerpo });
  if (error) {
    const st = error.context && error.context.status;
    let msg = st === 404 ? 'No existe la función "equipo" en Supabase (código 404).'
      : st === 401 ? 'Supabase rechazó la sesión (código 401). Revisá "Verify JWT" en la función.'
      : st ? 'Error del servidor (código ' + st + ').'
      : 'No se pudo conectar con la función "equipo" (' + (error.message || 'sin respuesta') + ').';
    try { const j = await error.context.json(); if (j && (j.error || j.message || j.msg)) msg = (j.error || j.message || j.msg) + (st ? ' (código ' + st + ')' : ''); } catch (e) {}
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function mensajeWhatsApp(nombre, mail, clave) {
  return 'Hola' + (nombre ? ' ' + nombre : '') + '! Ya tenés acceso al panel de Abrazo a Boca.\n' +
    'Entrá acá: ' + window.location.origin + '/?p=equipo\n' +
    'Mail: ' + mail + '\nClave: ' + clave + '\n' +
    'No compartas la clave. Si la perdés, avisame y te la cambio.';
}

function Equipo({ miEmail }) {
  const [miembros, setMiembros] = useState([]);
  const [f, setF] = useState({ email: '', nombre: '', rol: 'organizadora', clave: claveAlAzar() });
  const [enviando, setEnviando] = useState(false);
  const [error, setError] = useState('');
  const [aviso, setAviso] = useState(null);

  async function cargar() {
    const { data, error: err } = await sb.rpc('listar_equipo');
    if (err) setError(err.message); else setMiembros(data || []);
  }
  useEffect(() => { cargar(); }, []);

  async function guardar(e) {
    e.preventDefault();
    if (enviando) return;
    setError(''); setAviso(null);
    const mail = f.email.trim().toLowerCase();
    const clave = f.clave.trim();
    if (clave.length < 8) { setError('La clave tiene que tener al menos 8 caracteres.'); return; }
    setEnviando(true);
    try {
      await llamarEquipo({ accion: 'agregar', email: mail, nombre: f.nombre.trim(), rol: f.rol, clave });
      setAviso({ titulo: 'Listo: ' + mail + ' ya puede entrar.', texto: mensajeWhatsApp(f.nombre.trim(), mail, clave) });
      setF({ email: '', nombre: '', rol: 'organizadora', clave: claveAlAzar() });
      cargar();
    } catch (err) { setError(err.message); }
    setEnviando(false);
  }

  async function nuevaClave(m) {
    const clave = claveAlAzar();
    if (!window.confirm('¿Cambiar la clave de ' + m.email + '? La nueva va a ser: ' + clave)) return;
    setError(''); setAviso(null);
    try {
      await llamarEquipo({ accion: 'clave', email: m.email, clave });
      setAviso({ titulo: 'Clave nueva para ' + m.email, texto: mensajeWhatsApp(m.nombre, m.email, clave) });
      window.scrollTo(0, document.body.scrollHeight);
    } catch (err) { setError(err.message); }
  }

  async function quitar(mail) {
    if (!window.confirm('¿Quitar el acceso de ' + mail + '? Se borra su usuaria.')) return;
    setError(''); setAviso(null);
    try { await llamarEquipo({ accion: 'quitar', email: mail }); cargar(); }
    catch (err) { setError(err.message); }
  }

  async function copiar(t) {
    try { await navigator.clipboard.writeText(t); alert('Copiado. Pegalo en WhatsApp.'); }
    catch (e) { alert('No se pudo copiar. Seleccioná el texto y copialo a mano.'); }
  }

  const botonFicha = { marginTop: '.5rem', marginRight: '.5rem', display: 'inline-block', color: 'var(--azul)', borderColor: 'var(--azul)' };

  return (
    <section className="tarjeta" style={{ marginTop: '1.5rem' }}>
      <h2>Equipo</h2>
      {miembros.map((m) => (
        <div className="ficha" key={m.email}>
          <div className="nom">{m.nombre || m.email}<span className="etiqueta">{m.rol}</span></div>
          <div className="det">{m.email}</div>
          {m.email !== miEmail && (
            <div>
              <button className="chico secundario" style={botonFicha} onClick={() => nuevaClave(m)}>Cambiar clave</button>
              <button className="chico secundario" style={botonFicha} onClick={() => quitar(m.email)}>Quitar acceso</button>
            </div>
          )}
        </div>
      ))}

      <h2 style={{ marginTop: '1.5rem' }}>Sumar compañera</h2>
      <form onSubmit={guardar} noValidate>
        <label htmlFor="email-m">Mail</label>
        <input id="email-m" type="email" value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} autoCapitalize="none" autoCorrect="off" spellCheck="false" />
        <label htmlFor="nombre-m">Nombre</label>
        <input id="nombre-m" value={f.nombre} onChange={(e) => setF({ ...f, nombre: e.target.value })} />
        <label htmlFor="rol-m">Qué puede hacer</label>
        <select id="rol-m" value={f.rol} onChange={(e) => setF({ ...f, rol: e.target.value })}>
          <option value="organizadora">Organizadora: ve y descarga las inscripciones</option>
          <option value="acreditadora">Acreditadora: solo acredita en la puerta</option>
          <option value="admin">Administradora: todo, incluido el equipo</option>
        </select>
        <label htmlFor="clave-m">Clave</label>
        <input id="clave-m" value={f.clave} onChange={(e) => setF({ ...f, clave: e.target.value })} autoCapitalize="none" autoCorrect="off" spellCheck="false" />
        <p className="ayuda">Viene una sugerida. Podés cambiarla; mínimo 8 caracteres.</p>
        <button type="submit" disabled={enviando}>{enviando ? 'Creando…' : 'Crear acceso'}</button>
        {error && <p className="error" role="alert">{error}</p>}
      </form>

      {aviso && (
        <div className="ok" style={{ fontWeight: 400 }}>
          <b>{aviso.titulo}</b>
          <pre style={{ whiteSpace: 'pre-wrap', fontFamily: 'inherit', margin: '.6rem 0' }}>{aviso.texto}</pre>
          <button className="chico" style={{ marginTop: 0 }} onClick={() => copiar(aviso.texto)}>Copiar mensaje</button>
        </div>
      )}
    </section>
  );
}

function Tablero({ email }) {
  const [rol, setRol] = useState(undefined);
  const [lista, setLista] = useState(null);
  const [busca, setBusca] = useState('');
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState('');

  async function cargar() {
    setCargando(true); setError('');
    const { data, error: err } = await sb.rpc('listar_inscriptas');
    if (err) setError(err.message); else setLista(data || []);
    setCargando(false);
  }

  useEffect(() => {
    (async () => {
      const { data, error: err } = await sb.rpc('mi_rol');
      const r = err ? null : data;
      setRol(r);
      if (r === 'admin' || r === 'organizadora') cargar();
    })();
  }, []);

  const salir = () => sb.auth.signOut();

  const arriba = (
    <div className="panel-top">
      <div>
        <h1 style={{ color: 'var(--oro)' }}>Panel del equipo</h1>
        <div className="quien">{email}{rol ? ' · ' + rol : ''}</div>
      </div>
      <button className="chico secundario" onClick={salir}>Salir</button>
    </div>
  );

  if (rol === undefined) return <main>{arriba}<p>Cargando…</p></main>;

  if (!rol) return (
    <main>{arriba}
      <section className="tarjeta"><p style={{ margin: 0 }}>Este mail no está habilitado en el equipo. Pedile acceso a la administradora.</p></section>
      <p className="sello">{VERSION}</p>
    </main>
  );

  if (rol === 'acreditadora') return (
    <main>{arriba}
      <section className="tarjeta"><p style={{ margin: 0 }}>Tu acceso es para la acreditación en la puerta. Esa pantalla se habilita en el próximo paso.</p></section>
      <p className="sello">{VERSION}</p>
    </main>
  );

  const total = lista ? lista.length : 0;
  const ingresaron = lista ? lista.filter((r) => r.numero_sorteo).length : 0;
  const q = sinTildes(busca.trim());
  const filtrada = !lista ? [] : !q ? lista : lista.filter((r) =>
    sinTildes(r.nombre + ' ' + r.apellido + ' ' + r.dni + ' ' + r.email + ' ' + r.telefono + ' ' + r.codigo).indexOf(q) >= 0);
  const visibles = filtrada.slice(0, 200);

  return (
    <main>
      {arriba}
      <div className="numeros">
        <div className="numero-caja"><b>{total}</b><span>inscriptas de {CUPO}</span></div>
        <div className="numero-caja"><b>{ingresaron}</b><span>ingresaron</span></div>
      </div>

      <section className="tarjeta">
        <h2>Inscripciones</h2>
        <div className="acciones">
          <button className="secundario" onClick={cargar} disabled={cargando}>{cargando ? 'Actualizando…' : 'Actualizar'}</button>
          <button onClick={() => lista && descargarCSV(lista)} disabled={!lista || !lista.length}>Descargar Excel</button>
        </div>
        <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar por nombre, DNI, mail…" aria-label="Buscar" />
        {error && <p className="error" role="alert">{error}</p>}
        <div style={{ marginTop: '1rem' }}>
          {lista && !filtrada.length && <p>No hay resultados.</p>}
          {visibles.map((r) => (
            <div className="ficha" key={r.id}>
              <div className="nom">{r.nombre} {r.apellido}{r.numero_sorteo ? <span className="etiqueta">N° {r.numero_sorteo}</span> : null}</div>
              <div className="det">DNI {r.dni} · {r.email}{r.telefono ? ' · ' + r.telefono : ''}</div>
              <div className="det">Inscripta {fechaAR(r.creado_at)} · <span className="cod">{r.codigo}</span></div>
            </div>
          ))}
          {filtrada.length > 200 && <p className="nota">Se muestran 200 de {filtrada.length}. Usá el buscador o descargá el Excel.</p>}
        </div>
      </section>

      {rol === 'admin' && <Equipo miEmail={email} />}
      <p className="sello">{VERSION}</p>
    </main>
  );
}

function Panel() {
  const [sesion, setSesion] = useState(undefined);
  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSesion(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSesion(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  if (sesion === undefined) return <main><p>Cargando…</p></main>;
  if (!sesion) return <Login />;
  return <Tablero email={String(sesion.user.email || '').toLowerCase()} />;
}

function App() {
  const p = new URLSearchParams(window.location.search).get('p');
  if (p === 'equipo') return <Panel />;
  return <Inscripcion />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
